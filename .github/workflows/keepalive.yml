# Pings the Render-hosted APIs every 14 minutes so they don't sleep.
# Render free tier sleeps after 15 min idle; one cold start is ~30-60s, which
# is bad UX for someone clicking the live demo for the first time. Failures
# surface as failed workflow runs (GitHub will email on failure).
name: keepalive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: wake docs-agent
        run: curl -fsS --max-time 120 https://docs-agent-api.onrender.com/health
      - name: wake safewaves
        run: curl -fsS --max-time 120 https://safewaves-api.onrender.com/health
